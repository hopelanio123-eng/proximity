<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=overlays-content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Proximity">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090b10">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef1f7">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="Enter the access code to connect to your PC with Proximity.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%239b8cff'/%3E%3Cstop offset='.52' stop-color='%235b6cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8.75' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='white' stroke-width='1.8'/%3E%3Ccircle cx='16' cy='16' r='12.5' fill='none' stroke='white' stroke-width='1.2' opacity='.26'/%3E%3Ccircle cx='16' cy='16' r='2.7' fill='white'/%3E%3Ccircle cx='24.84' cy='7.16' r='2.3' fill='white'/%3E%3C/svg%3E">
    <title>Unlock · Proximity</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth">
    <div class="auth_shell">
        <div class="auth_brand">
            <span class="brand_mark" aria-hidden="true">
                <svg viewBox="0 0 32 32" fill="none">
                    <circle cx="16" cy="16" r="8.5" stroke="currentColor" stroke-width="1.8" />
                    <circle cx="16" cy="16" r="12.5" stroke="currentColor" stroke-width="1.2" opacity=".26" />
                    <circle cx="16" cy="16" r="2.7" fill="currentColor" />
                    <circle cx="24.84" cy="7.16" r="2.3" fill="currentColor" />
                </svg>
            </span>
            <div class="auth_brand_text">
                <span class="auth_brand_name">Proximity</span>
                <span class="auth_brand_sub">Control your PC from this device</span>
            </div>
        </div>

        <div class="auth_card">
            <h1>Enter access code</h1>
            <p>Your PC is protected. The code is shown in the Proximity window on the computer you want to control.</p>

            <form action="/" method="get">
                <label class="auth_label" for="access_code">Access code</label>
                <div class="auth_field">
                    <input type="password" id="access_code" name="access_code" placeholder="••••••" autocomplete="current-password" autocapitalize="off" spellcheck="false" autofocus />
                    <button id="toggle_code" type="button" aria-label="Show access code" aria-pressed="false" title="Show access code">
                        <svg class="eye_open" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z" />
                            <circle cx="12" cy="12" r="2.6" />
                        </svg>
                        <svg class="eye_closed" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
                            <path d="M4 4l16 16" />
                            <path d="M9.9 5.3A9.9 9.9 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3.2 4.1M6.6 7.4A16.6 16.6 0 0 0 2.5 12s3.5 7 9.5 7a9.9 9.9 0 0 0 4.1-.9" />
                            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                        </svg>
                    </button>
                </div>
                <button class="auth_submit" type="submit">Unlock session</button>
            </form>

            <p class="auth_note">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="5" y="10.5" width="14" height="9.5" rx="2" />
                    <path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" />
                </svg>
                Local network only
            </p>
        </div>
    </div>

    <script>
        (function () {
            var input = document.getElementById("access_code");
            var button = document.getElementById("toggle_code");
            var eyeOpen = button.querySelector(".eye_open");
            var eyeClosed = button.querySelector(".eye_closed");
            button.addEventListener("click", function () {
                var show = input.type === "password";
                input.type = show ? "text" : "password";
                eyeOpen.style.display = show ? "none" : "";
                eyeClosed.style.display = show ? "" : "none";
                button.setAttribute("aria-pressed", show ? "true" : "false");
                button.setAttribute("aria-label", show ? "Hide access code" : "Show access code");
                button.title = show ? "Hide access code" : "Show access code";
                input.focus();
            });
        })();
    </script>
</body>

</html>
