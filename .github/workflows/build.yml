name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Official Weylus build environment: cross-compiles Windows via mingw, builds Linux + deb
    container: docker://hhmhh/weylus_build:latest
    steps:
    - uses: actions/checkout@v6
    - name: Build
      run: ./docker_build.sh
      shell: bash
    - name: Upload Windows build
      uses: actions/upload-artifact@v6
      with:
        name: proximity-windows
        path: packages/proximity-windows.zip
    - name: Upload Linux build
      uses: actions/upload-artifact@v6
      with:
        name: proximity-linux
        path: packages/proximity-linux.zip
    - name: Upload Linux deb
      uses: actions/upload-artifact@v6
      with:
        name: proximity-deb
        path: packages/Proximity*.deb
